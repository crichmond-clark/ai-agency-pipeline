name: CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: DATABASE_URI=postgres://ci:ci@127.0.0.1:5432/ci PAYLOAD_SECRET=ci-only-secret PORTFOLIO_MODE=true npm run build
      - run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest
